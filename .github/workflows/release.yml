name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$EVENT_NAME" = "push" ]; then
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
              echo "❌ Tag $RELEASE_TAG does not exactly match package v$PACKAGE_VERSION"
              exit 1
            fi
          elif [[ ! "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$REQUESTED_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "❌ Requested version does not exactly match package $PACKAGE_VERSION"
            exit 1
          fi

      - name: Verify tag is signed
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TRUSTED_GPG_KEYS: ${{ secrets.TRUSTED_GPG_KEYS }}
        run: |
          if [ -z "$TRUSTED_GPG_KEYS" ]; then
            echo "❌ TRUSTED_GPG_KEYS is required to verify release tags"
            exit 1
          fi
          echo "$TRUSTED_GPG_KEYS" | base64 -d | gpg --import
          git verify-tag "$RELEASE_TAG"
          echo "✅ Tag signature verified"

  build-and-test:
    name: Build & Test for Release
    needs: validate-tag
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies (hermetic)
        run: npm ci --ignore-scripts

      - name: Build native dependencies
        run: npm rebuild better-sqlite3-multiple-ciphers

      - name: Build package
        run: npm run build

      - name: Run all tests
        run: npm run test:all

      - name: Create and verify commit-bound release candidate
        run: npm run release:candidate

      - name: Attest retained candidate and receipt
        id: attest-candidate
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            smartergpt-lex-*.tgz
            release-candidate.json

      - name: Stage attestation bundle with candidate
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest-candidate.outputs.bundle-path }}
        run: cp "$ATTESTATION_BUNDLE" ./release-candidate.attestation.jsonl

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: npm-candidate-${{ github.sha }}
          path: |
            smartergpt-lex-*.tgz
            release-candidate.json
            release-candidate.attestation.jsonl
          retention-days: 7
          if-no-files-found: error

  # NOTE: npm publish is done manually (2FA required) from the exact retained candidate.
  # Verify release-candidate.json, then publish its smartergpt-lex-*.tgz file directly.

  create-github-release:
    name: Create GitHub Release
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Download the attested candidate
        uses: actions/download-artifact@v8
        with:
          name: npm-candidate-${{ github.sha }}
          path: .

      - name: Bind the tag release to the published npm bytes
        run: |
          node scripts/verify-release-candidate.mjs --check-only
          node scripts/verify-published-candidate.mjs

      - name: Generate changelog
        id: changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Generate changelog between this tag and previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "Generating changelog from $PREV_TAG to $RELEASE_TAG"
            git log "$PREV_TAG..$RELEASE_TAG" --pretty=format:"- %s (%h)" > CHANGELOG.txt
          else
            echo "First release - listing all commits"
            git log --pretty=format:"- %s (%h)" > CHANGELOG.txt
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: CHANGELOG.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
